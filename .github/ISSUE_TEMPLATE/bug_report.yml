name: Bug report
description: Something in the panel does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can. **Never paste passwords, setup keys, tokens or private paths.**
        Security problems: please use the private security advisory link instead of this form.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this has not been reported yet
          required: true
        - label: I am using the latest release of the panel (or I say below which version)
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Server config
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Panel version
      description: Shown bottom left in the panel (e.g. 1.2.1)
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server build
      description: Shown bottom left in the panel (e.g. f77f3d3c)
  - type: dropdown
    id: platform
    attributes:
      label: Platform / backend
      options:
        - Windows (ConPTY)
        - Linux (native)
        - Docker
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium / Edge
        - Firefox
        - Safari
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `.local/supervisor.log`, `.local/supervisor.err.log` or the browser console. Remove secrets first.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help.
