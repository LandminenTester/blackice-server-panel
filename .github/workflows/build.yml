name: build-and-test
on:
  push:
    branches: [main, experimental]
    tags: ["v*"]
    # Templates and contribution files never affect the build (tag pushes always run).
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/CODEOWNERS"
      - "CONTRIBUTING.md"
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run check
      - run: npm --prefix ui run build
      - name: Copy licenses
        shell: bash
        run: cp -R licenses src/Web/wwwroot/
      - run: dotnet run --project tests/Core.Tests
      - run: dotnet run --project tests/Updates.Tests
      - run: dotnet run --project tests/Bridge.Tests
      - run: dotnet run --project tests/ServerUpdates.Tests
      - run: dotnet publish tests/ConsoleFixture -c Release -o .local/fixture
      - run: dotnet build tests/Backend.Tests -c Release
      - if: runner.os == 'Linux'
        run: cc -O2 -Wall -Wextra native/terminal.c -lutil -o tests/Backend.Tests/bin/Release/net10.0/replay-terminal
      - run: dotnet run --project tests/Backend.Tests -c Release --no-build -- .local/fixture
      - run: dotnet publish src/Web -c Release -o artifacts/web
      - run: dotnet publish src/Supervisor -c Release -o artifacts/supervisor
      - if: runner.os == 'Linux'
        run: cc -O2 native/terminal.c -lutil -o artifacts/supervisor/replay-terminal
      - run: node scripts/test-panel.mjs
      - run: node scripts/test-setup.mjs
      - if: runner.os == 'Windows'
        run: node scripts/test-install.mjs
      - run: dotnet publish src/Web -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/web
      - run: dotnet publish src/Supervisor -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/supervisor
      - name: Build direct Start entry
        shell: bash
        run: |
          dotnet publish src/Supervisor -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .local/launcher
          if [ "${{ runner.os }}" = "Windows" ]; then cp .local/launcher/Supervisor.exe Start.exe; else cp .local/launcher/Supervisor Start; chmod +x Start; fi
          sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props > VERSION
          mkdir -p .local/launcher-package/artifacts
          cp -R artifacts/web artifacts/supervisor .local/launcher-package/artifacts/
          cp Start* .local/launcher-package/
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Verify launcher lifecycle
        shell: bash
        env:
          PANEL_LAUNCHER_PACKAGE: .local/launcher-package
        run: node scripts/test-launcher.mjs
      - name: Verify update replacement and rollback
        env:
          PANEL_LAUNCHER_PACKAGE: .local/launcher-package
        run: node scripts/test-update-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: blackice-server-panel-${{ matrix.rid }}
          path: |
            VERSION
            Start*
            artifacts/
            scripts/
            deploy/
            docs/
            README*.md
            SECURITY.md
            LICENSE
            licenses/
            THIRD_PARTY_NOTICES.md
            panel.example.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: docker build -f tests/Linux.Dockerfile -t replay-panel-linux-tests .
      - run: docker run --rm replay-panel-linux-tests
      - run: docker build -t replay-panel:next .
      - run: node scripts/test-install.mjs --linux
      - run: node scripts/test-install.mjs --docker
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: blackice-server-panel-*
          path: packages
      - name: Package releases
        run: |
          cd packages/blackice-server-panel-win-x64 && zip -r ../../blackice-server-panel-win-x64.zip .
          cd ../blackice-server-panel-linux-x64
          chmod +x Start artifacts/web/Web artifacts/supervisor/Supervisor artifacts/supervisor/replay-terminal scripts/*.sh
          tar -czf ../../blackice-server-panel-linux-x64.tar.gz .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t ghcr.io/landminentester/blackice-server-panel:$VERSION .
          docker push ghcr.io/landminentester/blackice-server-panel:$VERSION
          docker save ghcr.io/landminentester/blackice-server-panel:$VERSION | gzip > blackice-server-panel-docker.tar.gz
      - name: Checksums
        run: sha256sum blackice-server-panel-win-x64.zip blackice-server-panel-linux-x64.tar.gz blackice-server-panel-docker.tar.gz > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            blackice-server-panel-win-x64.zip
            blackice-server-panel-linux-x64.tar.gz
            blackice-server-panel-docker.tar.gz
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags such as v1.5.0-experimental.1 are published as pre-releases and never become "latest".
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease --latest=false";; esac
          gh release create "$GITHUB_REF_NAME" blackice-server-panel-win-x64.zip blackice-server-panel-linux-x64.tar.gz blackice-server-panel-docker.tar.gz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --generate-notes $FLAGS
